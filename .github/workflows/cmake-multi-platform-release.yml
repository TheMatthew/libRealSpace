name: CMake Multi-Platform Release Build

on:
  release:
    types: [created, published]
  pull_request:
    branches: [ "master", "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: linux-build
            archive_extension: tar.gz
          - os: windows-latest
            artifact_name: windows-build
            archive_extension: zip
          - os: macos-latest
            artifact_name: macos-build
            archive_extension: tar.gz

    steps:
    - uses: actions/checkout@v4

    - name: Install SDL2 (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

    - name: Install SDL2 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sdl2 sdl2_ttf

    - name: Install SDL2 and imgui (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        vcpkg install sdl2:x64-windows sdl2-ttf:x64-windows imgui[sdl2-binding]:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

    - name: Install imgui (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone https://github.com/ocornut/imgui.git /tmp/imgui
        cd /tmp/imgui
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo cmake --install .

    - name: Install imgui (macOS)
      if: runner.os == 'macOS'
      run: |
        git clone https://github.com/ocornut/imgui.git /tmp/imgui
        cd /tmp/imgui
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo cmake --install .

    - name: Build and Install SDL2_mixer_ext (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        git clone https://github.com/WohlSoft/SDL-Mixer-X.git
        cd SDL-Mixer-X
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build . --config Release
        sudo cmake --install .

    - name: Build and Install SDL2_mixer_ext (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git clone https://github.com/WohlSoft/SDL-Mixer-X.git
        cd SDL-Mixer-X
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_INSTALL_PREFIX=C:/SDL2_mixer_ext
        cmake --build . --config Release
        cmake --install . --config Release
        echo "CMAKE_PREFIX_PATH=C:/SDL2_mixer_ext" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Package (Linux/macOS)
      if: runner.os != 'Windows'
      working-directory: ${{github.workspace}}/build
      run: |
        tar -czf ${{matrix.artifact_name}}.tar.gz *

    - name: Package (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{github.workspace}}/build
      shell: pwsh
      run: |
        Compress-Archive -Path * -DestinationPath ${{matrix.artifact_name}}.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.artifact_name}}
        path: |
          ${{github.workspace}}/build/${{matrix.artifact_name}}.${{matrix.archive_extension}}

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{github.workspace}}/build/${{matrix.artifact_name}}.${{matrix.archive_extension}}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
